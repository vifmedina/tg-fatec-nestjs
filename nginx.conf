events {
    worker_connections 2048;
}
http {
    access_log off;
    upstream nestjs_backend {
        server nestjs:3000;
        keepalive 64;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}